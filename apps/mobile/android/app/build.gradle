plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.nightshift.app"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.nightshift.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        buildConfigField "boolean", "ALLOW_DEBUG_SCREEN_CAPTURE", "false"
    }

    buildTypes {
        debug {
            // Explicit local opt-in for Vysor/device QA; never enabled by CI defaults.
            buildConfigField "boolean", "ALLOW_DEBUG_SCREEN_CAPTURE",
                (project.findProperty("NIGHTSHIFT_ALLOW_DEBUG_SCREEN_CAPTURE") == "true").toString()
        }
        profile {
            buildConfigField "boolean", "ALLOW_DEBUG_SCREEN_CAPTURE", "false"
        }
        release {
            // Production signing is intentionally not configured for a test milestone.
        }
    }
}

flutter {
    source = "../.."
}
