name: validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  staff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:admin
      - run: npm exec --workspace @nightshift/admin -- playwright install --with-deps chromium
      - run: npm run test:admin:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staff-synthetic-browser-failures
          path: apps/admin/test-results
          if-no-files-found: ignore
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: nightshift
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nightshift_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nightshift -d nightshift_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nightshift:isolated-ci-only@127.0.0.1:5432/nightshift_test
      TEST_DATABASE_URL: postgresql://nightshift:isolated-ci-only@127.0.0.1:5432/nightshift_test
      REDIS_URL: redis://127.0.0.1:6379
      DEV_AUTH_ENABLED: 'true'
      DEV_ACCESS_KEY: isolated-ci-fictional-identity-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
        timeout-minutes: 8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:economics
  android:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: nightshift
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nightshift_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nightshift -d nightshift_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://nightshift:isolated-ci-only@127.0.0.1:5432/nightshift_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: npm run check:client
      - run: npm run check:mobile
      - name: Verify history calendar time zones
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          for zone in UTC Asia/Kolkata America/New_York Pacific/Kiritimati; do
            printf '\nHistory calendar zone: %s\n' "$zone"
            TZ="$zone" NIGHTSHIFT_HISTORY_TEST_TZ="$zone" flutter test --no-pub --reporter expanded test/history_calendar_test.dart
          done
      - run: npm run test:review-reader
      - run: npm run test:staff-cookie
      - run: npm run test:call-invitations
      - run: npm run build
      - run: npm run smoke:accounts
      - run: npm run build:android
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_android_native.py
      - run: python scripts/check_android_native.py apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nightshift-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7
